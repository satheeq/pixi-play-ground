<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <script src="js/main.js"></script>

    <title>PIXI Play Ground</title>

    <style>
        #chartContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        #baseCanvas {
            pointer-events: none; /* Prevent top canvas from blocking clicks */
        }

        button {
            padding: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body onload="start()">
    <h1>Hello PixiJS</h1>
    <div style="margin-bottom: 10px;">
        <button id="speedPlus">Rotate Speed + </button>
        <button id="speedMinus">Rotate Speed - </button>
    </div>
    <div id="chartContainer" style="width: 800px; height: 600px"></div>
</body>
</html>
