<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <script src="js/main.js"></script>

    <title>PIXI Play Ground</title>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #controllerContainer {
            height: 75px;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 0 10px;
        }

        #chartContainer {
            flex: 1; /* fills remaining height */
            position: relative; /* stack children absolutely */
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            border: 1px solid blue;
        }

        #baseCanvas {
            pointer-events: none; /* Prevent top canvas from blocking clicks */
        }

        button {
            padding: 10px;
            border: 1px solid black;
        }
    </style>
</head>
<body onload="start()">
    <div id="controllerContainer" style="padding-bottom: 10px;">
        <h3>Hello PixiJS</h3>
        <button id="speedPlus">Rotate Speed + </button>
        <button id="speedMinus">Rotate Speed - </button>
    </div>
    <div id="chartContainer">
        <canvas id="overlayCanvas"></canvas>
        <canvas id="baseCanvas"></canvas>
    </div>
</body>
</html>
